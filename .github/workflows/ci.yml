name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Syntax check backend
        run: node --check server.js
        working-directory: backend
      - name: Syntax check frontend modules
        run: |
          node --check js/main.js
          node --check js/player.js
          node --check js/background.js
          node --check js/obstacle.js
          node --check js/audio.js
          node --check js/touch-joystick.js
        working-directory: frontend
      - name: Frontend smoke checks
        run: node scripts/smoke-check.js
